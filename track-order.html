<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Your Request — CHARMENTIST</title><link rel="stylesheet" href="assets/css/style.css">
<style>
  .track-form{ max-width:420px; margin:0 auto; text-align:left; }
  .track-form .field{ margin-bottom:16px; }
  .track-form label{ display:block; font-size:.72rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted,#8a8175); margin-bottom:6px; }
  .track-form input{
    width:100%; border:1px solid var(--line,#ddd6cb); background:transparent;
    padding:10px 12px; font-size:.85rem; font-family:inherit; color:var(--text,#141414);
  }
  .track-form input:focus{ outline:none; border-color:var(--text,#141414); }
  .track-msg{ font-size:.8rem; margin-top:14px; }
  .track-msg.err{ color:#a33; }

  .track-result{ max-width:560px; margin:40px auto 0; text-align:left; display:none; }
  .track-steps{ display:flex; justify-content:space-between; margin:28px 0 32px; position:relative; flex-wrap:wrap; gap:10px 0; }
  .track-steps::before{
    content:''; position:absolute; top:9px; left:0; right:0; height:1px; background:var(--line,#ddd6cb); z-index:0;
  }
  .track-step{ position:relative; z-index:1; text-align:center; flex:1; min-width:70px; }
  .track-step .dot{
    width:18px; height:18px; border-radius:50%; background:#fff; border:1px solid var(--line,#ddd6cb);
    margin:0 auto 8px;
  }
  .track-step.is-done .dot{ background:var(--text,#141414); border-color:var(--text,#141414); }
  .track-step .label{ font-size:.64rem; letter-spacing:.03em; text-transform:uppercase; color:var(--muted,#8a8175); }
  .track-step.is-done .label{ color:var(--text,#141414); }
  .track-cancelled-note{ font-size:.8rem; color:#a33; text-align:center; margin:-10px 0 24px; }

  .track-order-summary{ border:1px solid var(--line,#ddd6cb); padding:20px; }
  .track-order-summary .row{ display:flex; justify-content:space-between; font-size:.85rem; padding:6px 0; }
  .track-payment-box{ border:1px solid var(--line,#ddd6cb); padding:16px 18px; margin-top:20px; white-space:pre-wrap; font-size:.85rem; }
</style>
</head>
<body data-page="track-order.html">
<div id="site-header" data-variant="light"></div>

<section class="hero" style="min-height:28vh; background:none; color:var(--text); align-items:center;">
  <div class="hero-inner" style="color:var(--text);">
    <div class="hero-left">
      <div><h1 class="hero-title">TRACK YOUR REQUEST</h1></div>
    </div>
  </div>
</section>

<section class="section-pad" style="padding-top:0;">
  <div class="wrap center-col text-center" style="margin-bottom:30px;">
    <p class="small" style="max-width:440px; margin:0 auto;">
      Enter your request reference and the email address you used to see where things stand with your Concierge.
    </p>
  </div>

  <form class="track-form" id="track-form">
    <div class="field">
      <label for="track-ref">Request Reference</label>
      <input id="track-ref" placeholder="CHM-260929-1234" required>
    </div>
    <div class="field">
      <label for="track-email">Email Address</label>
      <input id="track-email" type="email" placeholder="you@example.com" required>
    </div>
    <button type="submit" class="btn btn-dark" style="width:100%; justify-content:center;">Track Request</button>
    <p class="track-msg err" id="track-msg" style="display:none;"></p>
  </form>

  <div class="track-result" id="track-result">

    <div class="track-steps" id="track-steps"></div>
    <p class="track-cancelled-note" id="track-cancelled-note" style="display:none;">This request has been closed.</p>

    <div class="track-order-summary">
      <p class="serif" style="margin:0 0 4px;" id="track-ref-label"></p>
      <p class="small" style="color:var(--muted); margin:0 0 16px;" id="track-date"></p>
      <div id="track-items"></div>
      <p class="small" style="margin-top:14px; color:var(--muted);" id="track-confirmed-amount"></p>
    </div>

    <div class="track-payment-box" id="track-payment-box" style="display:none;"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/currency.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function(){
  var API_BASE = window.CHARM_API_BASE || 'http://localhost:4000/api';

  var FLOW = ['requested', 'in_conversation', 'confirmed', 'payment_instructed', 'paid', 'in_production', 'dispatched', 'delivered'];
  var FLOW_LABELS = {
    requested: 'Request Sent', in_conversation: 'With Concierge', confirmed: 'Order Confirmed',
    payment_instructed: 'Payment Instructions Sent', paid: 'Payment Received',
    in_production: 'In Production', dispatched: 'Dispatched', delivered: 'Delivered'
  };

  function renderSteps(status){
    var container = document.getElementById('track-steps');
    var cancelledNote = document.getElementById('track-cancelled-note');

    if(status === 'cancelled'){
      container.innerHTML = '';
      cancelledNote.style.display = 'block';
      return;
    }
    cancelledNote.style.display = 'none';

    var currentIndex = FLOW.indexOf(status);
    container.innerHTML = FLOW.map(function(s, i){
      return '<div class="track-step' + (i <= currentIndex ? ' is-done' : '') + '">' +
        '<div class="dot"></div><div class="label">' + FLOW_LABELS[s] + '</div></div>';
    }).join('');
  }

  function renderEnquiry(e){
    document.getElementById('track-ref-label').textContent = 'Request ' + e.reference;
    var date = e.createdAt ? new Date(e.createdAt.replace(' ', 'T') + 'Z').toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }) : '';
    document.getElementById('track-date').textContent = 'Sent ' + date;

    renderSteps(e.status);

    document.getElementById('track-items').innerHTML = (e.items || []).map(function(i){
      return '<div class="row"><span>' + i.name + (i.size ? ' — size ' + i.size : '') + (i.qty > 1 ? ' × ' + i.qty : '') + '</span></div>';
    }).join('');

    var amountEl = document.getElementById('track-confirmed-amount');
    amountEl.textContent = e.confirmedAmount ? ('Confirmed amount: ' + e.confirmedAmount) : 'Final price to be confirmed by your Concierge.';

    var box = document.getElementById('track-payment-box');
    if(e.paymentInstruction){
      box.style.display = 'block';
      box.textContent = e.paymentInstruction + (e.paymentDue ? '\n\nPlease complete payment by: ' + e.paymentDue : '');
    } else if(e.trackingInfo){
      box.style.display = 'block';
      box.textContent = e.trackingInfo;
    } else {
      box.style.display = 'none';
    }

    document.getElementById('track-result').style.display = 'block';
  }

  // Pre-fill from a link that already has the reference + email (e.g. the
  // "Track This Request" button right after sending a request, or the
  // link in a Concierge email) and check automatically.
  var params = new URLSearchParams(window.location.search);
  var prefillRef = params.get('ref');
  var prefillEmail = params.get('email');
  if(prefillRef) document.getElementById('track-ref').value = prefillRef;
  if(prefillEmail) document.getElementById('track-email').value = prefillEmail;

  document.getElementById('track-form').addEventListener('submit', function(e){
    e.preventDefault();
    var msg = document.getElementById('track-msg');
    msg.style.display = 'none';
    document.getElementById('track-result').style.display = 'none';

    var reference = document.getElementById('track-ref').value.trim();
    var email = document.getElementById('track-email').value.trim();
    if(!reference || !email) return;

    fetch(API_BASE + '/enquiries/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reference: reference, email: email })
    })
      .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(result){
        if(!result.ok){
          msg.textContent = (result.data && result.data.error) || 'We could not find a request matching those details.';
          msg.style.display = 'block';
          return;
        }
        renderEnquiry(result.data.enquiry);
      })
      .catch(function(){
        msg.textContent = 'Could not reach the server right now — please try again in a moment.';
        msg.style.display = 'block';
      });
  });

  if(prefillRef && prefillEmail){
    document.getElementById('track-form').requestSubmit();
  }
})();
</script>
</body></html>
